<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d4b">
<title>ذِكْر</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: هادي، خاشع، واضح — تطبيق بيفكّرك بربنا من غير زحمة
   IDEA: سماء فوق مئذنة؛ لون السماء يتغير مع المواسم (عادي، شعبان، رمضان، العشر الأواخر، العيد)
   PICTURE: أفق مسجد بقباب ومآذن، وفي رمضان فوانيس متعلقة ونجوم، والصلاة الجاية كبيرة فوقه
   COLOUR and TYPE: زمردي + دهبي؛ رمضان كحلي ليلي + دهبي فانوس. Reem Kufi للعناوين، Amiri للأذكار، Plex Arabic للواجهة
   LAYOUT: عمود واحد بعرض موبايل (حد أقصى 760)، شريط تنقل تحت، رصيف تنبيهات ثابت فوق */
:root{color-scheme:light dark;
--field:#0b5d4b;--field2:#0f735d;--fink:#fff;--gold:#c9a24b;
--bg:light-dark(#f4f6f4,#0a1411);--card:light-dark(#ffffff,#12201b);--ink:light-dark(#11211c,#e6eee9);
--muted:light-dark(#5a6b64,#9bb0a7);--line:light-dark(#e1e7e3,#21332c);--soft:light-dark(#eaf2ee,#17291f);
--ok:#1c8a5a;--warn:#b5482b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-season=ramadan]{--field:#14215a;--field2:#1d2d74;--gold:#f0c05a;--bg:light-dark(#f3f3fa,#0a1030);--card:light-dark(#fff,#131b44);--soft:light-dark(#ecedf8,#1a2353);--line:light-dark(#e0e2f0,#26305e);--ink:light-dark(#141a3a,#eceefa);--muted:light-dark(#5c6185,#a3a9cf)}
:root[data-season=last10]{--field:#1d1045;--field2:#2c1a63;--gold:#f3cf74;--bg:light-dark(#f4f1fa,#0b071d);--card:light-dark(#fff,#150e33);--soft:light-dark(#eee9f8,#1d1541);--line:light-dark(#e2dcef,#2b2152);--ink:light-dark(#1a1233,#efeaff);--muted:light-dark(#645a85,#b0a6d6)}
:root[data-season=eid]{--field:#8c5a0e;--field2:#a86c12;--gold:#ffe08a;--soft:light-dark(#f8f0e1,#2a1f0d)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:21px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(180deg,var(--field) 0%,var(--field2) 100%);color:var(--fink);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
.hero .wrap{position:relative;z-index:2;padding-top:18px;padding-bottom:8px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;font-size:14px;opacity:.92}
.top b{font-family:"Reem Kufi";font-size:22px;display:block;opacity:1;color:var(--gold)}
.city{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;color:#fff;font-size:14px;min-height:36px}
.next{margin:18px 0 6px;text-align:center}
.next small{display:block;font-size:15px;opacity:.85}
.next .nm{font-family:"Reem Kufi";font-size:clamp(38px,11vw,54px);line-height:1.05;color:#fff}
.next .cd{font-size:clamp(28px,8vw,38px);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--gold);font-weight:600}
.sky{display:block;width:100%;height:120px;margin-top:-6px}
.times{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--card);border-radius:16px;padding:8px;margin:-34px 0 0;position:relative;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.times button{border-radius:12px;padding:8px 2px;text-align:center;font-size:13px;color:var(--muted);min-height:58px;position:relative}
.times button b{display:block;font-size:15px;color:var(--ink);white-space:nowrap;font-weight:600}
.times button.on{background:var(--field);color:#fff}.times button.on b{color:#fff}
.times button.prayed::after{content:"";position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.sec{margin-top:22px}
.sec>h2{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.field{background:var(--field);color:#fff;border:0}
.card.field .muted{color:rgba(255,255,255,.8)}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:start;min-height:56px}
.task:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.task .t{font-weight:600}.task .s{font-size:13px;color:var(--muted)}
.btn{background:var(--field);color:#fff;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600}
.btn.gold{background:var(--gold);color:#1a1405}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.big{font-family:"Reem Kufi";font-size:clamp(30px,8vw,42px);line-height:1.1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:13px;color:var(--ink)}
.pill.g{background:var(--gold);color:#1a1405}
/* dock */
#dock{position:fixed;top:0;inset-inline:0;z-index:50;padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none}
.al{pointer-events:auto;max-width:740px;margin:0 auto 8px;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;border-inline-start:5px solid var(--gold);animation:drop .35s ease}
.al .t{font-weight:700;font-family:"Reem Kufi";font-size:17px}
.al .b{font-size:14px;color:var(--muted);margin:2px 0 8px}
.al{padding:10px 12px}.al .row .btn{min-height:38px;padding:6px 14px;font-size:14px}
.al.more{padding:8px 14px;font-size:14px;text-align:center}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* nav */
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{padding:8px 0 6px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--field);font-weight:600}
:root[data-season=ramadan] nav button.on,:root[data-season=last10] nav button.on{color:light-dark(var(--field),var(--gold))}
.view{display:none}.view.on{display:block}
.vh{background:var(--field);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 0 18px}
.vh h1{font-size:28px}.vh p{margin:4px 0 0;opacity:.85;font-size:14px}
/* tabs */
.seg{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.seg button{flex:none;padding:8px 14px;border-radius:99px;background:var(--soft);min-height:40px;font-size:14px}
.seg button.on{background:var(--field);color:#fff}
/* zikr */
.z{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;width:100%;text-align:start;display:block;transition:transform .1s}
.z:active{transform:scale(.99)}
.z .tx{font-family:Amiri,serif;font-size:21px;line-height:1.95}
.z .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.z .cnt{min-width:64px;text-align:center;border-radius:99px;padding:6px 12px;background:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.z.fin{opacity:.55}.z.fin .cnt{background:var(--ok);color:#fff}
.z .note{font-size:13px;color:var(--muted)}
.counter{display:grid;place-items:center;gap:10px;padding:24px 0}
.ring{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--soft) 0);position:relative}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring>div{position:relative;text-align:center}
.ring b{font-family:"Reem Kufi";font-size:clamp(40px,12vw,58px);line-height:1;display:block;font-variant-numeric:tabular-nums}
/* quran */
.qhead{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;align-items:center}
.qhead .ring{width:100%}
.qhead .ring::before{inset:12px}
.qhead .ring b{font-size:34px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px;font-family:"Reem Kufi"}
.stats span{font-size:12px;color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:90px;margin-top:8px}
.hist i{display:block;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.hist i.z0{background:var(--line)}
.hl{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;font-size:10px;color:var(--muted);text-align:center}
/* fasting list */
.fd{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fd:first-child{border-top:0}
.fd .dt{width:58px;text-align:center;flex:none;background:var(--soft);border-radius:12px;padding:6px 0}
.fd .dt b{display:block;font-size:20px;font-family:"Reem Kufi";line-height:1.1}
.fd .dt span{font-size:12px;color:var(--muted)}
.tog{min-width:84px}
.tog.on{background:var(--ok);color:#fff}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set:first-of-type{border-top:0}
.set label{flex:1 1 180px}
.set small{display:block;color:var(--muted);font-size:13px}
input[type=time],input[type=number],input[type=date],select{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;font-size:16px}
input[type=number]{width:90px}
textarea{width:100%;min-height:120px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;direction:ltr}
.sw{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--ok)}.sw:checked::after{inset-inline-start:25px}
.dua{font-family:Amiri,serif;font-size:20px;line-height:1.9;margin:8px 0}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline:16px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:60;text-align:center;animation:drop .3s}
@media(max-width:420px){.times button{font-size:12px}.times button b{font-size:13.5px}.qhead{grid-template-columns:120px minmax(0,1fr)}.qhead .ring b{font-size:26px}}
</style>
</head>
<body>
<div id="dock" aria-live="polite"></div>

<!-- HOME -->
<section class="view on" id="v-home">
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <div><b id="hDate"></b><span id="gDate"></span></div>
        <button class="city" id="cityBtn"></button>

        <small id="nextLbl">الصلاة الجاية</small>
        <div class="nm" id="nextName">—</div>
        <div class="cd" id="nextCd">--:--:--</div>
      </div>
    </div>
    <svg class="sky" id="sky" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  </header>
  <div class="wrap">
    <div class="times" id="times"></div>
    <p class="hint">دوس على الصلاة بعد ما تصليها عشان تتعلّم</p>
    <div id="permCard"></div>
    <div id="seasonCard" class="sec"></div>
    <div class="sec"><h2>مهام النهارده</h2><div class="card" id="tasks"></div></div>
    <div class="sec"><h2>الصيام الجاي</h2><div class="card" id="nextFast"></div></div>
    <div class="sec"><h2>ذكر اللحظة</h2><button class="card z" id="dhikrNow" style="text-align:center"></button></div>
  </div>
</section>

<!-- AZKAR -->
<section class="view" id="v-azkar">
  <div class="vh"><div class="wrap"><h1>الأذكار</h1><p>دوس على الذكر عشان تعدّ</p></div></div>
  <div class="wrap">
    <div class="seg" id="azSeg"></div>
    <div id="azProg" style="margin:10px 0 14px"></div>
    <div id="azList"></div>
  </div>
</section>

<!-- QURAN -->
<section class="view" id="v-quran">
  <div class="vh"><div class="wrap"><h1>وردك من القرآن</h1><p id="qSub"></p></div></div>
  <div class="wrap" id="qBody"></div>
</section>

<!-- FAST -->
<section class="view" id="v-fast">
  <div class="vh"><div class="wrap"><h1>الصيام</h1><p>الأيام اللي جاية، ودوس "هصوم" عشان يصحيك للسحور</p></div></div>
  <div class="wrap" id="fBody"></div>
</section>

<!-- SETTINGS -->
<section class="view" id="v-set">
  <div class="vh"><div class="wrap"><h1>الإعدادات</h1><p>كل حاجة هنا بتتحفظ على جهازك</p></div></div>
  <div class="wrap" id="sBody"></div>
</section>

<nav id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3c-2 2-5 3-5 7v10h10V10c0-4-3-5-5-7z"/><path d="M4 20h16M10 20v-4a2 2 0 0 1 4 0v4"/></svg>الرئيسية</button>
  <button data-v="azkar"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="17" cy="9" r="2"/><circle cx="17" cy="15" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="7" cy="15" r="2"/><circle cx="7" cy="9" r="2"/></svg>الأذكار</button>
  <button data-v="quran"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5z"/><path d="M12 6v14"/></svg>القرآن</button>
  <button data-v="fast"><svg viewBox="0 0 24 24"><path d="M15 3a8 8 0 1 0 6 13A7 7 0 0 1 15 3z"/></svg>الصيام</button>
  <button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>الإعدادات</button>
</nav>

  rows+='<div class="fd"><div class="dt"><b>'+AR(ymd(k)[2])+'</b><span>'+DAYS[dow(k)]+'</span></div><div class="sp"><b>'+esc(f.l)+'</b><div class="muted">'+hStr(hij(k))+' • '+fmtG(k)+(i===0?' — النهارده':i===1?' — بكرة':'')+'</div></div>'+
  (past?'<button class="btn sm tog'+(S.fasted[k]?' on':'')+'" data-fasted="'+k+'">'+(S.fasted[k]?'صايم':'صُمت؟')+'</button>':'<button class="btn sm tog'+(S.plan[k]?' on':'')+'" data-plan="'+k+'">هصوم</button>')+'</div>'}
 let cnt=0;for(const k in S.fasted)if(S.fasted[k])cnt++;
 $('#fBody').innerHTML='<div class="card sec"><div class="stats" style="margin:0"><div><b>'+AR(cnt)+'</b><span>يوم صمته</span></div><div><b>'+AR(S.qada)+'</b><span>قضاء عليك</span></div><div><b>'+AR(S.shawwal)+'/٦</b><span>شوال</span></div></div>'+
  '<div class="set"><label>أيام القضاء اللي عليك<small>هفكّرك بيها في شعبان قبل رمضان</small></label><div class="row"><button class="btn sm ghost" data-qa="-1">−</button><b>'+AR(S.qada)+'</b><button class="btn sm ghost" data-qa="1">+</button></div></div>'+
  '<div class="set"><label>صمت يوم من الست من شوال</label><div class="row"><button class="btn sm ghost" data-sh="-1">−</button><b>'+AR(S.shawwal)+'</b><button class="btn sm ghost" data-sh="1">+</button></div></div></div>'+
  '<div class="card"><h3>الشهرين الجايين</h3>'+(rows||'<p class="muted">فعّل أنواع الصيام من الإعدادات.</p>')+'</div>'+
  '<p class="muted">التاريخ الهجري محسوب بتقويم أم القرى. لو عندك فرق يوم عن الرؤية في مصر، عدّله من الإعدادات.</p>'}

/* ================= RENDER: SETTINGS ================= */
function sw(id,on){return'<input type="checkbox" class="sw" data-s="'+id+'" '+(on?'checked':'')+' aria-label="'+id+'">'}
function renderS(){const N=S.n;const P=NATIVE?{permission:'granted'}:window.Notification;const ci=CITIES.findIndex(c=>c[0]===S.loc.name);
 $('#sBody').innerHTML='<div class="card sec"><h3>المكان ومواقيت الصلاة</h3>'+
 '<div class="set"><label for="city">المدينة</label><select id="city">'+CITIES.map((c,i)=>'<option value="'+i+'" '+(i===ci?'selected':'')+'>'+c[0]+'</option>').join('')+(ci<0?'<option selected>'+esc(S.loc.name)+'</option>':'')+'</select></div>'+
 '<div class="set"><label>موقعي بالـ GPS<small>أدق لو انت برا المدن دي</small></label><button class="btn sm ghost" id="gps">حدّد موقعي</button></div>'+
 '<div class="set"><label for="meth">طريقة الحساب</label><select id="meth">'+Object.entries(METHODS).map(([k,v])=>'<option value="'+k+'" '+(S.loc.method===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div>'+
 '<div class="set"><label>تعديل التاريخ الهجري<small>النهارده: '+hStr(hij(T))+'</small></label><div class="row"><button class="btn sm ghost" data-ho="-1">−١</button><b>'+AR(S.hOff)+'</b><button class="btn sm ghost" data-ho="1">+١</button></div></div></div>'+
 '<div class="card"><h3>الإشعارات</h3><div class="set"><label>الحالة<small>'+(!P?'غير مدعومة هنا':P.permission==='granted'?'شغالة':P.permission==='denied'?'مقفولة من المتصفح':'لسه متفعّلتش')+'</small></label><div class="row">'+(P&&P.permission==='default'?'<button class="btn sm" id="permBtn">فعّل</button>':'')+'<button class="btn sm ghost" id="testN">جرّب تنبيه</button></div></div>'+
 '<div class="set"><label for="rep">التنبيهات المهمة تتكرر كل<small>أذكار، ورد، صيام، سحور — لحد ما تدوس إغلاق</small></label><div class="row"><input type="number" id="rep" data-n="repeat" min="5" max="120" value="'+N.repeat+'"><span class="muted">دقيقة</span></div></div></div>'+
 (NATIVE?'<div class="card"><h3>عشان التنبيهات متتأخرش</h3><p class="muted">اسمح للبرنامج بالتنبيه في الوقت بالظبط، وشيله من توفير البطارية (الإعدادات ← التطبيقات ← ذِكْر ← البطارية ← بلا قيود).</p><button class="btn sm" id="exactBtn">اسمح بالتنبيه في الوقت بالظبط</button></div>':'')+'<div class="card"><h3>الصلاة</h3><div class="set"><label>تذكير قبل الصلاة</label>'+sw('prayer',N.prayer)+'</div><div class="set"><label>قبلها بـ</label><div class="row"><input type="number" data-n="before" min="1" max="60" value="'+N.before+'"><span class="muted">دقيقة</span></div></div><div class="set"><label>تنبيه وقت الأذان نفسه</label>'+sw('adhan',N.adhan)+'</div>'+
 '<div class="set"><label>الثلث الأخير من الليل (قيام)<small>في العشر الأواخر بيشتغل لوحده</small></label>'+sw('qiyam',N.qiyam)+'</div><div class="set"><label>صلاة الضحى</label>'+sw('duha',N.duha)+'</div></div>'+
 '<div class="card"><h3>الأذكار</h3><div class="set"><label>أذكار الصباح<small>بعد الفجر بـ</small></label><div class="row"><input type="number" data-n="mAfter" min="0" max="180" value="'+N.mAfter+'">'+sw('morning',N.morning)+'</div></div>'+
 '<div class="set"><label>أذكار المساء<small>بعد العصر بـ</small></label><div class="row"><input type="number" data-n="eAfter" min="0" max="180" value="'+N.eAfter+'">'+sw('evening',N.evening)+'</div></div>'+
 '<div class="set"><label>ذكر خفيف طول اليوم<small>كل كام دقيقة</small></label><div class="row"><input type="number" data-n="dEvery" min="30" max="480" step="15" value="'+N.dEvery+'">'+sw('dhikr',N.dhikr)+'</div></div>'+
 '<div class="set"><label>ساعات الهدوء<small>مفيش ذكر خفيف فيها</small></label><div class="row"><input type="time" data-n="qFrom" value="'+N.qFrom+'"><span class="muted">لـ</span><input type="time" data-n="qTo" value="'+N.qTo+'"></div></div>'+
 '<div class="set"><label>سورة الكهف يوم الجمعة</label><div class="row"><input type="time" data-n="kTime" value="'+N.kTime+'">'+sw('kahf',N.kahf)+'</div></div></div>'+
 '<div class="card"><h3>ورد القرآن</h3><div class="set"><label>معاد التذكير</label><div class="row"><input type="time" data-n="wTime" value="'+N.wTime+'">'+sw('wird',N.wird)+'</div></div></div>'+
 '<div class="card"><h3>الصيام</h3><div class="set"><label>تذكير الليلة اللي قبلها</label><div class="row"><input type="time" data-n="fTime" value="'+N.fTime+'">'+sw('fast',N.fast)+'</div></div>'+
 '<div class="set"><label>تذكير السحور<small>قبل الفجر بـ (لو دوست هصوم، وفي رمضان كل يوم)</small></label><div class="row"><input type="number" data-n="sBefore" min="10" max="180" value="'+N.sBefore+'">'+sw('suhoor',N.suhoor)+'</div></div>'+
 [['monthu','الاتنين والخميس'],['white','الأيام البيض (١٣، ١٤، ١٥)'],['special','عرفة وعاشوراء والعشر من ذي الحجة'],['shawwal','الست من شوال']].map(([k,l])=>'<div class="set"><label>'+l+'</label><input type="checkbox" class="sw" data-ty="'+k+'" '+(N.types[k]?'checked':'')+'></div>').join('')+'</div>'+
 '<div class="card"><h3>التصميم والمواسم</h3><p class="muted">التصميم بيتغير لوحده: رمضان، العشر الأواخر، والعيد. تقدر تعاين أي واحد دلوقتي.</p><div class="row">'+[['auto','تلقائي'],['normal','عادي'],['prep','شعبان'],['ramadan','رمضان'],['last10','العشر الأواخر'],['eid','العيد']].map(([k,l])=>'<button class="btn sm '+(S.season===k?'':'ghost')+'" data-se="'+k+'">'+l+'</button>').join('')+'</div></div>'+
 '<div class="card"><h3>نقل بياناتك لجهاز تاني</h3><p class="muted">انسخ الكود ده والصقه في البرنامج على الجهاز التاني.</p><textarea id="exp" readonly>'+esc(JSON.stringify({...S,ack:{},shown:{}}))+'</textarea><div class="row" style="margin-top:8px"><button class="btn sm ghost" id="copyExp">انسخ</button></div><textarea id="imp" placeholder="الصق هنا الكود من الجهاز التاني" style="margin-top:12px"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" id="doImp">استرجاع</button></div></div>'}

/* ================= NAV & EVENTS ================= */
let cur='home';
function go(v){cur=v;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render(v);window.scrollTo(0,0)}
function render(v){({home:renderHome,azkar:renderAz,quran:renderQ,fast:renderF,set:renderS})[v]()}
function renderAll(){document.documentElement.dataset.season=seasonOf(T).name;render(cur);renderDock()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function askPerm(){try{const r=await Notification.requestPermission();if(r==='granted'){toast('الإشعارات اتفعّلت');engine()}else toast('الإشعارات متفعّلتش')}catch(e){toast('المتصفح رفض الإشعارات')}renderAll()}

document.body.addEventListener('click',e=>{const b=e.target.closest('button,[data-p]');if(!b)return;const d=b.dataset;
 if(b.id==='permBtn')return askPerm();
 if(b.id==='exactBtn'){try{LN.changeExactNotificationSetting()}catch(x){}return}
 if(b.id==='cityBtn')return go('set');
 if(d.p){const pr=S.prayed[T]=S.prayed[T]||{};if(d.p==='sunrise')return;pr[d.p]=pr[d.p]?0:1;save();if(pr[d.p])toast('تقبّل الله');return renderHome()}
 if(d.t){if(d.t==='m'||d.t==='e'){azTab=d.t;return go('azkar')}if(d.t==='q')return go('quran');if(d.t==='f'){S.fasted[T]=S.fasted[T]?0:1;const h=hij(T);if(h.m===10&&S.fasted[T])S.shawwal=Math.min(6,S.shawwal+1);save();return renderHome()}}
 if(d.plan){S.plan[d.plan]=S.plan[d.plan]?0:1;save();if(S.plan[d.plan])toast('تمام، هفكرك بالسحور');return render(cur)}
 if(d.fasted){S.fasted[d.fasted]=S.fasted[d.fasted]?0:1;save();return renderF()}
 if(b.id==='dhikrNow'){b.querySelector('.tx').textContent=DH[Math.random()*DH.length|0];return}
 if(d.az){azTab=d.az;return renderAz()}
 if(d.z!==undefined)return tapZ(+d.z);
 if(b.id==='azAll'){const st=S.az[T][azTab];AZ[azTab].l.forEach((z,i)=>st[i]=z[1]);(S.azDone[T]=S.azDone[T]||{})[azTab]=1;ackKind({m:'morning',e:'evening'}[azTab]||'',T);save();toast('تقبّل الله منك');return renderAz()}
 if(b.id==='tasBtn'){const t=S.tas;t.n++;t.total++;if(t.n>=t.target){if(navigator.vibrate)try{navigator.vibrate([60,40,60])}catch(x){}t.n=0;toast('تم '+AR(t.target))}else if(navigator.vibrate)try{navigator.vibrate(8)}catch(x){}save();return renderAz()}
 if(d.tt){S.tas.target=+d.tt;S.tas.n=0;save();return renderAz()}
 if(b.id==='tasReset'){S.tas.n=0;save();return renderAz()}
 if(d.pg){if(d.pg==='w'){const w=wird();addPages(Math.max(1,w.target-w.done))}else addPages(+d.pg);return}
 if(b.id==='pgSet'){const v=Math.max(0,Math.min(TOTAL,+$('#pgTo').value||0));addPages(v-S.wird.page);return}
 if(d.qd){S.wird.end=addD(T,+d.qd-1);save();toast('الهدف اتظبط');return renderQ()}
 if(d.kh){const end=seasonOf(T).preview?addD(T,25):ramadanEnd(T);S.wird.end=end;if(d.kh==='2'){toast('ختمتين: '+AR(Math.ceil(2*TOTAL/Math.max(1,diffD(T,end)+1)))+' صفحة يوميًا — ظبطت هدف الختمة الأولى على نص رمضان');S.wird.end=addD(T,Math.floor(diffD(T,end)/2))}else toast('هدفك: ختمة قبل آخر رمضان');save();return renderHome()}
 if(d.qa){S.qada=Math.max(0,S.qada+ +d.qa);save();return renderF()}
 if(d.sh){S.shawwal=Math.max(0,Math.min(6,S.shawwal+ +d.sh));save();return renderF()}
 if(d.ho){S.hOff=Math.max(-2,Math.min(2,S.hOff+ +d.ho));save();return renderAll()}
 if(d.se){S.season=d.se;save();renderAll();return toast(d.se==='auto'?'رجع تلقائي':'معاينة: '+b.textContent)}
 if(b.id==='gps'){if(!navigator.geolocation)return toast('الجهاز مش بيدعم تحديد الموقع');navigator.geolocation.getCurrentPosition(p=>{S.loc={name:'موقعي الحالي',lat:p.coords.latitude,lng:p.coords.longitude,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,method:S.loc.method};PC={};PF=TF=null;save();toast('تم تحديد موقعك');renderAll()},()=>toast('مقدرتش أحدد موقعك — اختار المدينة من القايمة'),{timeout:15000});return}
 if(b.id==='testN'){const e={id:'test@'+T,k:T,kind:'test',time:Date.now(),title:'تجربة تنبيه',body:'لو شايف ده يبقى التنبيهات شغالة. سبحان الله وبحمده',persist:1,exp:Date.now()+6e5};notify(e);chime();toast(window.Notification&&Notification.permission==='granted'?'بعتّ تنبيه تجريبي':'الإشعارات مش مفعّلة — التنبيهات هتظهر جوه البرنامج بس');return}
 if(b.id==='copyExp'){const t=$('#exp');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('اتنسخ'),()=>toast('حدد النص وانسخه يدوي'))}catch(x){toast('حدد النص وانسخه يدوي')}return}
 if(b.id==='doImp'){try{const o=JSON.parse($('#imp').value);S=merge(structuredClone(DEF),o);PC={};PF=TF=null;save();toast('اتسترجعت بياناتك');renderAll()}catch(x){toast('الكود ده مش سليم')}return}
});
document.body.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.id==='city'){const c=CITIES[+t.value];if(!c)return;S.loc={name:c[0],lat:c[1],lng:c[2],tz:c[3],method:c[4]};PC={};PF=TF=null;save();T=keyOf(new Date());toast('المواقيت اتحدّثت لـ'+c[0]);return renderAll()}
 if(t.id==='meth'){S.loc.method=t.value;PC={};save();return toast('طريقة الحساب اتغيرت')}
 if(d.s){S.n[d.s]=t.checked;save();return}
 if(d.ty){S.n.types[d.ty]=t.checked;save();return}
 if(d.n){S.n[d.n]=t.type==='number'?Math.max(+t.min||0,Math.min(+t.max||999,+t.value||0)):t.value;save();return}
 if(t.id==='qEnd'&&t.value){S.wird.end=t.value;save();return renderQ()}
 if(t.id==='qSurah'&&t.value!==''){S.wird.page=SP[+t.value]-1;S.wird.start=T;save();toast('هتبدأ من سورة '+SURAH[+t.value]);return renderQ()}
});

/* ================= BOOT ================= */
const qs=new URLSearchParams(location.search);if(qs.get('ack')){S.ack[qs.get('ack')]=Date.now();save()}
if(qs.get('go'))cur=qs.get('go');
if(!NATIVE&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;navigator.serviceWorker.addEventListener('message',m=>{const x=m.data||{};if(x.type==='ack'){S.ack[x.id]=Date.now();save();renderDock()}else if(x.type==='act'){const e=due(Date.now()).find(y=>y.id===x.id);e?doAct(e):null}})}).catch(()=>{})}
window.__z={evts,fastInfo,hij,addD,get T(){return T}};
prune();go(cur);engine();nativeInit();
try{caches.open('zikr-acks').then(c=>c.keys().then(ks=>{ks.forEach(r=>{const id=decodeURIComponent(r.url.split('/__ack/')[1]||'');if(id)S.ack[id]=Date.now();c.delete(r)});save();renderDock()}))}catch(e){}
setInterval(tickHero,1000);setInterval(engine,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){engine();render(cur)}});
}
</script>
</body>
</html>
